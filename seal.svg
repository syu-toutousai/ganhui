<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="印：干慧">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough)">
    <rect x="12" y="12" width="216" height="216" rx="10" fill="#b03a2e"/>
    <rect x="24" y="24" width="192" height="192" rx="6" fill="none" stroke="#f7f4ec" stroke-width="4" opacity=".85"/>
  </g>
  <g filter="url(#rough)" fill="#f7f4ec" font-family="'Songti SC','Noto Serif CJK SC','Source Han Serif SC','SimSun',serif" font-weight="700" text-anchor="middle">
    <text x="120" y="108" font-size="92">干</text>
    <text x="120" y="202" font-size="92">慧</text>
  </g>
</svg>
