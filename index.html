<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N3+ 全程中文的课，不是「教学」，是关于日语的汉语节目。</title>
<style>
  :root{--paper:#f7f4ec;--ink:#1c1a17;--seal:#b03a2e}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at 30% 15%, #fbf9f3, #f3efe4 72%);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    padding:8vmin 7vmin 14vmin;
    font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","Yu Mincho","SimSun",serif;
  }
  main{display:flex;flex-direction:column;align-items:center;max-width:26em}
  h1{font-size:clamp(20px,4.6vw,40px);font-weight:600;line-height:2.05;letter-spacing:.02em;text-align:center}
  .seal{align-self:flex-end;width:clamp(64px,9vw,92px);height:auto;margin:.2em .4em 0 0;transform:rotate(-8deg);opacity:.94}
  ::selection{background:var(--seal);color:var(--paper)}
</style>
</head>
<body>
<main>
  <h1>N3+ 全程中文的课，不是「教学」，是关于日语的汉语节目。</h1>
  <img class="seal" src="./seal.svg" alt="印：干慧">
</main>
</body>
</html>
